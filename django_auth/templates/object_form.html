{% extends 'base.html' %}

{% block title %}
{{ title }}
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <!-- Шапка карточки с заголовком -->
            <div class="card-header">
                <h3 class="card-title">{{ title }}</h3>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="card-body">
                    {{ form.as_p }}
                </div>

                <!-- Подвал карточки с кнопками действий -->
                <div class="card-footer d-flex justify-content-between align-items-center">
                    <a href="javascript:history.back()" class="btn btn-outline-pink btn-sm rounded-pill">
                        Отмена
                    </a>
                    <button type="submit" class="btn btn-outline-teal btn-sm rounded-pill me-1">
                        Сохранить
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
