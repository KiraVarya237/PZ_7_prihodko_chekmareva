<div class="card card-sm border-0 shadow-sm">
    <div class="card-body">
        <div class="row align-items-center">
            <div class="col-auto">
                <span class="avatar bg-{{ color|default:'blue' }}-lt text-{{ color|default:'blue' }} rounded-circle fs-2">
                    {{ icon }}
                </span>
            </div>
            <div class="col">
                <div class="font-weight-medium text-muted">
                    {{ title }}
                </div>
                <div class="text-dark fw-bold fs-2">
                    {{ value }}
                </div>
            </div>
        </div>
    </div>
</div>
